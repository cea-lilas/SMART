[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SMART"
version = "1.0.0"
description = "A package to compute spherical aperture mass maps from galaxy ellipticity catalogs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Igor Bezmaternykh" }
]
dependencies = [
  "numpy>=2.0",
  "healpy>=1.18",
  "astropy>=7.2",
  "scipy>=1.13",
  "tqdm"
]

[dependency-groups]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0"
]

[tool.setuptools.packages.find]
include = ["smart*"]
