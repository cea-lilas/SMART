[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SMART"
version = "1.0.0"
description = "A package to compute spherical aperture mass maps from galaxy ellipticity catalogs"
readme = "README.md"
authors = [
  { name = "Igor Bezmaternykh" }
]
dependencies = [
  "numpy",
  "healpy",
  "astropy",
  "scipy"
]

[tool.setuptools.packages.find]
include = ["package*"]